name: Plug RunsOn Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/runs-on.yml'
      - '.github/workflows/plug-runs-on-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: RunsOn ${{ matrix.runner }}
    # Fork and Dependabot pull requests execute PR code only on GitHub-hosted
    # infrastructure. Same-repository non-Dependabot PRs and workflow_dispatch
    # runs may use RunsOn, which is the trusted-repository smoke path.
    runs-on: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'
          )
        ) &&
        format('runs-on={0}/runner={1}', github.run_id, matrix.runner) ||
        'ubuntu-latest'
      }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: bb-x64-16
            cpu: 16
            ram_gib: 64
            disk_gb: 200
            require_on_demand: false
            require_local_nvme: false
          - runner: bb-x64-16-nvme
            cpu: 16
            ram_gib: 64
            disk_gb: 40
            require_on_demand: false
            require_local_nvme: true
          - runner: bb-x64-16-ondemand
            cpu: 16
            ram_gib: 64
            disk_gb: 200
            require_on_demand: true
            require_local_nvme: true
          - runner: bb-x64-4
            cpu: 4
            ram_gib: 16
            disk_gb: 100
            require_on_demand: false
            require_local_nvme: false
    env:
      RUNSON_TRUSTED: >-
        ${{ github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             github.actor != 'dependabot[bot]') }}
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0
        if: env.RUNSON_TRUSTED == 'true'

      - name: Prepare smoke evidence
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_EVIDENCE_DIR"
          {
            echo "run_id=${{ github.run_id }}"
            echo "event_name=${{ github.event_name }}"
            echo "repository=${{ github.repository }}"
            echo "trusted=${RUNSON_TRUSTED}"
            echo "runner_class=${{ matrix.runner }}"
          } | tee "$SMOKE_EVIDENCE_DIR/run-context.log"

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/checkout-revision.log") 2>&1
          actual_revision="$(git rev-parse HEAD)"
          echo "expected_revision=$EXPECTED_REVISION"
          echo "actual_revision=$actual_revision"
          test "$actual_revision" = "$EXPECTED_REVISION"

      - name: Report runner target and capacity
        env:
          TARGET_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/runner-report.log") 2>&1
          test "$TARGET_REPOSITORY" = "buildbetter-app/plugs"
          echo "target_repository=$TARGET_REPOSITORY"
          echo "runson_trusted=$RUNSON_TRUSTED"
          echo "runner_class=${{ matrix.runner }}"
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "cpus=$(nproc)"
          free -h
          df -h /

      - name: Check RunsOn instance and capacity
        if: env.RUNSON_TRUSTED == 'true'
        env:
          MIN_CPU: ${{ matrix.cpu }}
          RAM_GIB: ${{ matrix.ram_gib }}
          DISK_GB: ${{ matrix.disk_gb }}
          REQUIRE_ON_DEMAND: ${{ matrix.require_on_demand }}
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/capacity.log") 2>&1
          token=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --request PUT --header 'X-aws-ec2-metadata-token-ttl-seconds: 60' \
            http://169.254.169.254/latest/api/token)
          instance_type=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --header "X-aws-ec2-metadata-token: $token" \
            http://169.254.169.254/latest/meta-data/instance-type)
          instance_lifecycle=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            --header "X-aws-ec2-metadata-token: $token" \
            http://169.254.169.254/latest/meta-data/instance-life-cycle)
          echo "instance_type=$instance_type"
          echo "instance_lifecycle=$instance_lifecycle"
          if [[ "$REQUIRE_ON_DEMAND" == "true" && "$instance_lifecycle" != "on-demand" ]]; then
            echo "::error::instance_lifecycle=$instance_lifecycle, expected on-demand"
            exit 1
          fi
          cpus=$(nproc)
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          disk_kib=$(df --output=size -k / | tail -1 | tr -d ' ')
          echo "cpus=$cpus mem_kib=$mem_kib disk_kib=$disk_kib"
          failed=0
          if (( cpus < MIN_CPU )); then
            echo "::error::$cpus vCPUs, expected at least $MIN_CPU"
            failed=1
          fi
          if (( mem_kib < RAM_GIB * 1024 * 1024 * 9 / 10 )); then
            echo "::error::$((mem_kib / 1048576)) GiB RAM, expected about $RAM_GIB"
            failed=1
          fi
          if (( disk_kib < DISK_GB * 1000000000 / 1024 * 9 / 10 )); then
            echo "::error::$((disk_kib * 1024 / 1000000000)) GB disk, expected about $DISK_GB"
            failed=1
          fi
          exit "$failed"

      - name: Check local NVMe placement
        if: env.RUNSON_TRUSTED == 'true' && matrix.require_local_nvme
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/nvme.log") 2>&1
          root=$(stat -c %d /)
          failed=0
          for path in /home/runner /var/lib/docker /tmp; do
            backing=$path
            fstype=$(findmnt -n -o FSTYPE --target "$path")
            if [[ "$fstype" == overlay ]]; then
              backing=$(findmnt -n -o OPTIONS --target "$path" | tr ',' '\n' | sed -n 's/^upperdir=//p')
              if [[ -z "$backing" ]]; then
                echo "::error::$path is an overlay without an upper directory"
                failed=1
                continue
              fi
            fi
            mount_source=$(findmnt -n -o SOURCE --target "$backing")
            device=${mount_source%%\[*}
            models=$( (lsblk -s -n -l -o TYPE,MODEL "$device" 2>/dev/null || true) | awk '$1 == "disk" { $1 = ""; sub(/^ /, ""); print }' | sort -u)
            echo "$path fstype=$fstype backing=$backing source=$mount_source disks=${models//$'\n'/; }"
            if [[ "$(stat -c %d "$backing")" == "$root" ]]; then
              echo "::error::$path is backed by the root volume, expected local NVMe"
              failed=1
            elif [[ -z "$models" ]] || grep -qv 'Instance Storage' <<<"$models"; then
              echo "::error::$path is backed by '${models:-no disk}', expected EC2 NVMe Instance Storage"
              failed=1
            fi
          done
          exit "$failed"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Record Go version
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
        run: |
          set -euo pipefail
          go version | tee "$SMOKE_EVIDENCE_DIR/go-version.log"

      - name: Install pinned Bazelisk
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZEL_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
          BAZEL_BIN: ${{ runner.temp }}/plug-bazelisk
          BAZEL_RC: ${{ runner.temp }}/plug-runs-on.bazelrc
          BAZELISK_HOME: ${{ runner.temp }}/plug-bazelisk-home
          BAZEL_REPOSITORY_CACHE: ${{ runner.temp }}/plug-runs-on-repository-cache
          BAZELISK_VERIFY_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/bazel-bootstrap.log") 2>&1
          bazel_version="$(tr -d '[:space:]' < .bazelversion)"
          test "$bazel_version" = "9.3.0"
          mkdir -p "$BAZELISK_HOME" "$BAZEL_REPOSITORY_CACHE"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$BAZEL_BIN" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          printf '%s  %s\n' "$BAZELISK_SHA256" "$BAZEL_BIN" | sha256sum --check --status
          chmod 755 "$BAZEL_BIN"
          cat > "$BAZEL_RC" <<EOF
          common --enable_bzlmod
          common --color=no
          common --repository_cache=$BAZEL_REPOSITORY_CACHE
          common --jobs=2
          common --local_resources=memory=8192
          common --remote_cache=
          common --remote_executor=
          common --repo_contents_cache=
          test --nocache_test_results
          test --test_output=errors
          test --test_timeout=900
          EOF
          printf '%s\n' \
            "bazel_version=$bazel_version" \
            "bazelisk_version=v1.29.0" \
            "bazelisk_sha256=$BAZELISK_SHA256" \
            "bazel_sha256=$BAZEL_SHA256" \
            "repository_cache=$BAZEL_REPOSITORY_CACHE" \
            "remote_cache=" \
            "remote_executor=" \
            "repo_contents_cache=" \
            "jobs=2" \
            "local_resources=memory=8192" \
            "test_timeout=900" | tee "$SMOKE_EVIDENCE_DIR/toolchain.txt"

      - name: Record Bazel version
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
          BAZEL_BIN: ${{ runner.temp }}/plug-bazelisk
          BAZEL_RC: ${{ runner.temp }}/plug-runs-on.bazelrc
          BAZELISK_HOME: ${{ runner.temp }}/plug-bazelisk-home
          BAZELISK_VERIFY_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          exec > >(tee "$SMOKE_EVIDENCE_DIR/bazel-version.log") 2>&1
          "$BAZEL_BIN" --nosystem_rc --nohome_rc --noworkspace_rc \
            --bazelrc="$BAZEL_RC" version

      - name: Shutdown Bazel
        if: ${{ always() }}
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/plug-runs-on-evidence
          BAZEL_BIN: ${{ runner.temp }}/plug-bazelisk
          BAZEL_RC: ${{ runner.temp }}/plug-runs-on.bazelrc
          BAZELISK_HOME: ${{ runner.temp }}/plug-bazelisk-home
          BAZELISK_VERIFY_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set +e
          mkdir -p "$SMOKE_EVIDENCE_DIR"
          if [[ -x "$BAZEL_BIN" ]]; then
            "$BAZEL_BIN" --nosystem_rc --nohome_rc --noworkspace_rc \
              --bazelrc="$BAZEL_RC" shutdown > "$SMOKE_EVIDENCE_DIR/bazel-shutdown.log" 2>&1
            shutdown_status=$?
            printf 'shutdown_exit_code=%s\n' "$shutdown_status" >> "$SMOKE_EVIDENCE_DIR/bazel-shutdown.log"
            exit "$shutdown_status"
          fi
          printf '%s\n' 'shutdown_exit_code=not-run (Bazelisk was not installed)' \
            > "$SMOKE_EVIDENCE_DIR/bazel-shutdown.log"

      - name: Upload RunsOn smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plug-runs-on-evidence-${{ github.run_id }}-${{ matrix.runner }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/plug-runs-on-evidence
