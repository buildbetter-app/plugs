name: Plug RunsOn Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/runs-on.yml'
      - '.github/workflows/plug-runs-on-smoke.yml'

permissions:
  contents: read

jobs:
  bb-x64-16:
    name: RunsOn bb-x64-16
    runs-on: runs-on=${{ github.run_id }}/runner=bb-x64-16
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Print runner capacity
        run: |
          set -euo pipefail
          echo "runner_class=bb-x64-16"
          echo "cpus=$(nproc)"
          free -h
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Bazelisk
        uses: ./.github/actions/setup-bazel

      - name: Check Bazel version
        run: bazel version

  bb-x64-4:
    name: RunsOn bb-x64-4
    runs-on: runs-on=${{ github.run_id }}/runner=bb-x64-4
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Print runner capacity
        run: |
          set -euo pipefail
          echo "runner_class=bb-x64-4"
          echo "cpus=$(nproc)"
          free -h
          df -h /

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Bazelisk
        uses: ./.github/actions/setup-bazel

      - name: Check Bazel version
        run: bazel version
