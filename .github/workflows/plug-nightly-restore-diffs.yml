name: Plug Nightly Restore Diffs

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plug-nightly-restore-diffs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-store-diffs:
    name: Public fixture fresh-store comparisons
    runs-on: runs-on=${{ github.run_id }}/runner=bb-x64-16
    timeout-minutes: 45
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and prepare evidence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n1-restore-evidence"
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          test "$actual_sha" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = os.environ["EXPECTED_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          report = {
              "schema": "plug-nightly-restore-run/v1",
              "expected_sha": expected,
              "head": actual,
              "tree": tree,
              "checkout_verified": actual == expected,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "fixture_scope": "checked-in public synthetic snapshot and history fixtures only",
              "night_streak": "not evaluated by a single run",
          }
          Path(os.environ["RUNNER_TEMP"], "n1-restore-evidence", "run.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

      - name: Restore verified Bazel repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/n1-bazel-repository-cache
          key: plug-bazel-repository-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install pinned Bazel toolchain
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZEL_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < .bazelversion)" = 9.3.0
          mkdir -p "$RUNNER_TEMP/n1-bazelisk" "$RUNNER_TEMP/n1-bazel-repository-cache"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/n1-bazel" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          printf '%s  %s\n' "$BAZELISK_SHA256" "$RUNNER_TEMP/n1-bazel" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/n1-bazel"
          {
            echo "BAZELISK_HOME=$RUNNER_TEMP/n1-bazelisk"
            echo "BAZELISK_VERIFY_SHA256=$BAZEL_SHA256"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/n1.bazelrc" <<EOF
          common --enable_bzlmod
          common --color=no
          common --repository_cache=$RUNNER_TEMP/n1-bazel-repository-cache
          common --remote_cache=
          common --remote_executor=
          common --repo_contents_cache=
          test --nocache_test_results
          test --test_output=all
          test --test_timeout=900
          EOF

      - name: Compare fresh stores and verify typed boundaries
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/n1-bazel" --nosystem_rc --nohome_rc --noworkspace_rc \
            --bazelrc="$RUNNER_TEMP/n1.bazelrc" test \
            //internal/integration/nightlyrestore:nightlyrestore_test \
            --lockfile_mode=error --jobs=4 --local_resources=cpu=4 \
            2>&1 | tee "$RUNNER_TEMP/n1-restore-evidence/bazel.log"
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > "$RUNNER_TEMP/n1-restore-evidence/exit_code"
          exit "$rc"

      - name: Preserve test evidence and stop Bazel
        if: always()
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/n1-restore-evidence"
          mkdir -p "$destination"
          testlogs="bazel-testlogs/internal/integration/nightlyrestore/nightlyrestore_test"
          if [[ -d "$testlogs" ]]; then
            cp -R -L "$testlogs" "$destination/test-results"
          fi
          if [[ -x "$RUNNER_TEMP/n1-bazel" ]]; then
            "$RUNNER_TEMP/n1-bazel" --nosystem_rc --nohome_rc --noworkspace_rc \
              --bazelrc="$RUNNER_TEMP/n1.bazelrc" shutdown
          fi
          {
            echo 'Fresh public/synthetic fixture comparisons only.'
            echo 'Full, partial and snapshot comparisons use real memory, SQLite and PostgreSQL stores.'
            echo 'Partial history retains exact gaps and typed floor truncation; snapshot versions are restore bases.'
            echo 'This is not real-ledger/source-exporter history qualification or a three-night streak.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plug-nightly-restore-diffs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/n1-restore-evidence
