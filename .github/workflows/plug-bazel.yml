name: Plug Bazel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plug-bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: Plug Bazel lanes
    # Fork and Dependabot pull requests execute PR code only on GitHub-hosted
    # infrastructure. Same-repository non-Dependabot PRs and pushes or manual
    # runs may use the trusted RunsOn runner.
    runs-on: >-
      ${{
        (
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'
          )
        ) &&
        format('runs-on={0}/runner=bb-x64-16', github.run_id) ||
        'ubuntu-latest'
      }}
    # Keep the existing 45-minute envelope plus both 150-minute CP7 targets
    # even if they run serially, with 15 minutes to finalize evidence. This
    # stays within the six-hour GitHub-hosted fallback job limit.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      RUNSON_TRUSTED: >-
        ${{ github.event_name != 'pull_request' ||
            (github.event.pull_request.head.repo.full_name == github.repository &&
             github.actor != 'dependabot[bot]') }}
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: env.RUNSON_TRUSTED == 'true'

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: false

      - name: Verify Google Chrome is on PATH
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is missing from PATH on the Plug CI runner" >&2
            exit 1
          fi
          google-chrome --version

      - name: Validate Plug CI contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PLUG_BAZEL_EVIDENCE_DIR="$RUNNER_TEMP/plug-bazel-evidence"
          export PLUG_BAZEL_TARGETS_DIR="$RUNNER_TEMP/plug-bazel-targets"
          export PLUG_BAZEL_REPOSITORY_CACHE="$RUNNER_TEMP/plug-bazel-repository-cache"
          {
            echo "PLUG_BAZEL_EVIDENCE_DIR=$RUNNER_TEMP/plug-bazel-evidence"
            echo "PLUG_BAZEL_TARGETS_DIR=$RUNNER_TEMP/plug-bazel-targets"
            echo "PLUG_BAZEL_REPOSITORY_CACHE=$RUNNER_TEMP/plug-bazel-repository-cache"
          } >> "$GITHUB_ENV"
          mkdir -p "$PLUG_BAZEL_EVIDENCE_DIR"
          python3 scripts/ci/plug-bazel-delivery.py begin --output "$PLUG_BAZEL_EVIDENCE_DIR" \
            --base "${BASE_SHA:-}" --head "$HEAD_SHA"
          scripts/ci/plug-bazel-config-test.sh | tee "$PLUG_BAZEL_EVIDENCE_DIR/config.log"

      - name: Restore verified Bazel repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/plug-bazel-repository-cache
          key: plug-bazel-repository-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install pinned Bazel toolchain
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZEL_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          bazel_version="$(tr -d '[:space:]' < .bazelversion)"
          [[ "$bazel_version" == 9.3.0 ]] || { echo "unsupported Bazel pin: $bazel_version" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/plug-bazelisk-home" "$PLUG_BAZEL_REPOSITORY_CACHE"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/plug-bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          printf '%s  %s\n' "$BAZELISK_SHA256" "$RUNNER_TEMP/plug-bazelisk" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/plug-bazelisk"
          cat > "$RUNNER_TEMP/plug.bazelrc" <<EOF
          common --enable_bzlmod
          common --color=no
          common --repository_cache=$PLUG_BAZEL_REPOSITORY_CACHE
          common --remote_cache=
          common --remote_executor=
          common --repo_contents_cache=
          test --nocache_test_results
          test --test_output=errors
          test --test_timeout=900,900,900,9000
          test --test_env=PLUG_SOURCE_MODULE_ROOT=$GITHUB_WORKSPACE
          EOF
          export BAZELISK_HOME="$RUNNER_TEMP/plug-bazelisk-home"
          export BAZELISK_VERIFY_SHA256="$BAZEL_SHA256"
          {
            echo "BAZEL_BIN=$RUNNER_TEMP/plug-bazelisk"
            echo "BAZEL_RC=$RUNNER_TEMP/plug.bazelrc"
            echo "BAZELISK_HOME=$BAZELISK_HOME"
            echo "BAZELISK_VERIFY_SHA256=$BAZELISK_VERIFY_SHA256"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/plug-bazelisk" --version | tee "$PLUG_BAZEL_EVIDENCE_DIR/bazel-version.log"
          grep -Fq "bazel $bazel_version" "$PLUG_BAZEL_EVIDENCE_DIR/bazel-version.log"
          printf '%s\n' "bazel_version=$bazel_version" "bazelisk_version=v1.29.0" \
            "repository_cache=$PLUG_BAZEL_REPOSITORY_CACHE" \
            "action_cache=disabled" "remote_execution=disabled" > "$PLUG_BAZEL_EVIDENCE_DIR/toolchain.txt"

      - name: Resolve complete Plug Bazel selection
        id: public_runtime_selection
        run: |
          set -euo pipefail
          python3 scripts/ci/plug-bazel-delivery.py selection --output "$PLUG_BAZEL_EVIDENCE_DIR"
          selected="$(python3 scripts/ci/plug-bazel-delivery.py public-selection --output "$PLUG_BAZEL_EVIDENCE_DIR")"
          [[ "$selected" == true || "$selected" == false ]]
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"

      - name: Prepare verified public Beads executable
        if: ${{ steps.public_runtime_selection.outputs.selected == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Reviewed helper supports the separately admitted native descriptor.
          # Ordinary CI selects the accepted native descriptor below.
          TRUSTED_PREPARER_SHA: 70230ccd92597a96000f90223c5d89b103e25426
          TRUSTED_PREPARER_SHA256: 6a84191fd016ddcb637cb5a470e88727176a70e8b5c6e8e6c69f33db6a1559eb
          PUBLIC_BUNDLE_DESCRIPTOR: 41800330346:13307042737:ac028e4b1be9609415dde0d9f2a30e12f37f3be5f3f02e4a89b356749fc4e25a
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = buildbetter-app/plugs
          [[ "$TRUSTED_PREPARER_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/buildbetter-app/plugs/contents/scripts/ci/prepare-public-bundle.py?ref=$TRUSTED_PREPARER_SHA" \
            > "$RUNNER_TEMP/prepare-public-bundle.py"
          printf '%s  %s\n' "$TRUSTED_PREPARER_SHA256" "$RUNNER_TEMP/prepare-public-bundle.py" | sha256sum --check --status
          descriptor="$(python3 "$RUNNER_TEMP/prepare-public-bundle.py" request \
            --args "test --test_env=PLUG_PUBLIC_BUNDLE=$PUBLIC_BUNDLE_DESCRIPTOR")"
          test "$descriptor" = "$PUBLIC_BUNDLE_DESCRIPTOR"
          python3 "$RUNNER_TEMP/prepare-public-bundle.py" prepare \
            --descriptor "$descriptor" \
            --output "$RUNNER_TEMP/plug-public-bundle-runtime" \
            --github-env "$GITHUB_ENV" \
            --evidence "$PLUG_BAZEL_EVIDENCE_DIR/public-bundle.json"
          printf '%s\n' \
            "trusted_preparer_sha=$TRUSTED_PREPARER_SHA" \
            "trusted_preparer_sha256=$TRUSTED_PREPARER_SHA256" \
            "descriptor=$descriptor" > "$PLUG_BAZEL_EVIDENCE_DIR/public-bundle-helper-binding.txt"

      # Run the existing lanes as one union, retaining full per-test evidence.
      - name: Capture and run Plug Bazel lanes
        run: python3 scripts/ci/plug-bazel-delivery.py run --output "$PLUG_BAZEL_EVIDENCE_DIR"

      - name: Stop Bazel and finalize delivery bundle
        if: ${{ always() }}
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/ci/plug-bazel-delivery.py finish \
            --output "$RUNNER_TEMP/plug-bazel-evidence" --job-status "$PRIOR_JOB_STATUS"

      - name: Upload Plug CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plug-bazel-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/plug-bazel-evidence

      - name: Save verified Bazel repository cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/plug-bazel-repository-cache
          key: plug-bazel-repository-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
