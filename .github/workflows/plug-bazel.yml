# Keep the reusable workflow and harness checkout on the same reviewed commit.
name: Plug Bazel

on:
  pull_request:
    branches: [beads]

permissions:
  contents: read

concurrency:
  group: beads-bazel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bazel:
    uses: buildbetter-app/plugs/.github/workflows/plug-beads-bazel.yml@4a45ae331f20575c88a5f186eb13dc27d7abd18d
    with:
      harness_sha: 4a45ae331f20575c88a5f186eb13dc27d7abd18d
