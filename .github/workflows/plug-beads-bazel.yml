name: Beads Bazel reusable gate

on:
  workflow_call:
    inputs:
      harness_sha:
        description: Immutable reviewed commit containing this workflow and its harness
        required: true
        type: string

permissions:
  contents: read

jobs:
  bazel:
    name: Plug Bazel lanes
    # Only same-repository, non-Dependabot PRs may execute on RunsOn.
    runs-on: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        format('runs-on={0}/runner=bb-x64-16', github.run_id) ||
        'ubuntu-latest'
      }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUNSON_TRUSTED: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' }}
    steps:
      - name: Set up RunsOn
        if: env.RUNSON_TRUSTED == 'true'
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc # v2.7.0

      - name: Validate caller
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          [[ "$BASE_REF" == beads ]]
          [[ "$GITHUB_REPOSITORY" == buildbetter-app/plugs ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/beads-bazel-evidence"

      - name: Checkout exact Beads head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable CI harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: buildbetter-app/plugs
          ref: ${{ inputs.harness_sha }}
          path: ci-harness
          fetch-depth: 1
          persist-credentials: false

      - name: Install verified Bazel toolchain
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZEL_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beads-bazelisk-home" "$RUNNER_TEMP/beads-repository-cache"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/beads-bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          printf '%s  %s\n' "$BAZELISK_SHA256" "$RUNNER_TEMP/beads-bazelisk" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/beads-bazelisk"
          cat > "$RUNNER_TEMP/beads.bazelrc" <<RC
          common --enable_bzlmod
          common --color=no
          common --repository_cache=$RUNNER_TEMP/beads-repository-cache
          common --remote_cache=
          common --remote_executor=
          common --repo_contents_cache=
          RC
          export BAZELISK_HOME="$RUNNER_TEMP/beads-bazelisk-home"
          export BAZELISK_VERIFY_SHA256="$BAZEL_SHA256"
          export USE_BAZEL_VERSION=9.3.0
          {
            echo "BAZELISK_HOME=$BAZELISK_HOME"
            echo "BAZELISK_VERIFY_SHA256=$BAZELISK_VERIFY_SHA256"
            echo "USE_BAZEL_VERSION=$USE_BAZEL_VERSION"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/beads-bazelisk" --version | tee "$RUNNER_TEMP/beads-bazel-evidence/bazel-version.log"
          grep -Fxq 'bazel 9.3.0' "$RUNNER_TEMP/beads-bazel-evidence/bazel-version.log"
          printf '%s\n' 'bazel_version=9.3.0' 'bazelisk_version=v1.29.0' \
            "bazelisk_sha256=$BAZELISK_SHA256" "bazel_sha256=$BAZEL_SHA256" \
            'action_cache=disabled' 'remote_execution=disabled' \
            > "$RUNNER_TEMP/beads-bazel-evidence/toolchain.txt"

      - name: Validate contract and run actual Beads lanes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
        run: |
          set -euo pipefail
          python3 -B ci-harness/.github/scripts/beads-ci-contract.py check-workflow \
            ci-harness/.github/workflows/plug-beads-bazel.yml
          python3 -B ci-harness/.github/scripts/beads-ci-contract.py run \
            --source "$GITHUB_WORKSPACE/source" \
            --harness "$GITHUB_WORKSPACE/ci-harness" --harness-sha "$HARNESS_SHA" \
            --evidence "$RUNNER_TEMP/beads-bazel-evidence" --expected-sha "$SOURCE_SHA" \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --bazel "$RUNNER_TEMP/beads-bazelisk" \
            --rc "$RUNNER_TEMP/beads.bazelrc"

      - name: Upload Beads CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beads-bazel-evidence-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/beads-bazel-evidence
