name: Plug Remote Bazel

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string
      label:
        description: Short run label used for the run and artifact name
        required: true
        type: string
      args:
        description: Bazel arguments, provided as one whitespace-separated string
        required: true
        type: string

run-name: remote-bazel ${{ inputs.label }} ${{ inputs.sha }}

permissions:
  contents: read

jobs:
  remote-bazel:
    name: Remote Bazel
    runs-on: runs-on=${{ github.run_id }}/runner=bb-x64-16
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      ARGS_INPUT: ${{ inputs.args }}
    steps:
      - name: Set up RunsOn
        uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0

      - name: Set remote Bazel paths
        env:
          REMOTE_BAZEL_EVIDENCE_DIR: ${{ runner.temp }}/remote-bazel-evidence
          PLUG_BAZEL_REPOSITORY_CACHE: ${{ runner.temp }}/plug-bazel-repository-cache
        run: |
          {
            echo "REMOTE_BAZEL_EVIDENCE_DIR=$REMOTE_BAZEL_EVIDENCE_DIR"
            echo "PLUG_BAZEL_REPOSITORY_CACHE=$PLUG_BAZEL_REPOSITORY_CACHE"
          } >> "$GITHUB_ENV"

      - name: Validate dispatch inputs
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          }
          [[ "$INPUT_LABEL" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || {
            echo "::error::label must match [A-Za-z0-9._-]{1,80}" >&2
            exit 1
          }

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: false

      - name: Verify Google Chrome is on PATH
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is missing from PATH on the RunsOn runner" >&2
            exit 1
          fi
          google-chrome --version

      - name: Prepare remote Bazel evidence
        run: |
          set -euo pipefail
          mkdir -p "$REMOTE_BAZEL_EVIDENCE_DIR" "$PLUG_BAZEL_REPOSITORY_CACHE"
          printf '%s\n' "sha=${{ inputs.sha }}" "label=${{ inputs.label }}" \
            "args=$ARGS_INPUT" > "$REMOTE_BAZEL_EVIDENCE_DIR/request.txt"

      - name: Select opt-in public reference
        id: public_reference
        if: ${{ contains(inputs.args, 'PLUG_PUBLIC_REFERENCE') }}
        env:
          # Pin the reviewed public-reference helper atom independently of
          # the workflow file's own revision. The companion helper is fetched
          # from the same immutable commit because the reference helper imports it.
          PUBLIC_REFERENCE_HELPER_SHA: 2bc67952b75b580c6ed843e94900596e592f99fe
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = buildbetter-app/plugs
          [[ "$PUBLIC_REFERENCE_HELPER_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Both privileged reference helpers come from this reviewed atom.
          for name in prepare-public-bundle.py prepare-public-reference.py; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/buildbetter-app/plugs/contents/scripts/ci/$name?ref=$PUBLIC_REFERENCE_HELPER_SHA" \
              > "$RUNNER_TEMP/$name"
          done
          descriptor="$(python3 "$RUNNER_TEMP/prepare-public-reference.py" request --args "$ARGS_INPUT")"
          printf 'descriptor=%s\n' "$descriptor" >> "$GITHUB_OUTPUT"

      - name: Prepare verified public reference and source
        if: ${{ steps.public_reference.outputs.descriptor != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REFERENCE_DESCRIPTOR: ${{ steps.public_reference.outputs.descriptor }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/prepare-public-reference.py" prepare \
            --descriptor "$PUBLIC_REFERENCE_DESCRIPTOR" \
            --output "$RUNNER_TEMP/plug-public-reference" \
            --github-env "$GITHUB_ENV" \
            --evidence "$REMOTE_BAZEL_EVIDENCE_DIR/public-reference.json"

      - name: Select opt-in public executable bundle
        id: public_bundle
        if: ${{ contains(inputs.args, 'PLUG_PUBLIC_BUNDLE') }}
        env:
          # Use the same independently reviewed helper as ordinary CI.
          # Only trusted-source admission selects a native descriptor/profile.
          TRUSTED_PREPARER_SHA: 70230ccd92597a96000f90223c5d89b103e25426
          TRUSTED_PREPARER_SHA256: 6a84191fd016ddcb637cb5a470e88727176a70e8b5c6e8e6c69f33db6a1559eb
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$ARGS_INPUT" != *PLUG_PUBLIC_BUNDLE* ]]; then
            exit 0
          fi
          test "$GITHUB_REPOSITORY" = buildbetter-app/plugs
          [[ "$TRUSTED_PREPARER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_PREPARER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          # Never execute the test candidate's helper in the privileged step.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/buildbetter-app/plugs/contents/scripts/ci/prepare-public-bundle.py?ref=$TRUSTED_PREPARER_SHA" \
            > "$RUNNER_TEMP/prepare-public-bundle.py"
          printf '%s  %s\n' "$TRUSTED_PREPARER_SHA256" "$RUNNER_TEMP/prepare-public-bundle.py" | sha256sum --check --status
          descriptor="$(python3 "$RUNNER_TEMP/prepare-public-bundle.py" request --args "$ARGS_INPUT")"
          printf '%s\n' "trusted_preparer_sha=$TRUSTED_PREPARER_SHA" \
            "trusted_preparer_sha256=$TRUSTED_PREPARER_SHA256" "descriptor=$descriptor" \
            > "$REMOTE_BAZEL_EVIDENCE_DIR/public-bundle-helper-binding.txt"
          printf 'descriptor=%s\n' "$descriptor" >> "$GITHUB_OUTPUT"

      - name: Prepare verified public executable bundle
        if: ${{ steps.public_bundle.outputs.descriptor != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_BUNDLE_DESCRIPTOR: ${{ steps.public_bundle.outputs.descriptor }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/prepare-public-bundle.py" prepare \
            --descriptor "$PUBLIC_BUNDLE_DESCRIPTOR" \
            --output "$RUNNER_TEMP/plug-public-bundle-runtime" \
            --github-env "$GITHUB_ENV" \
            --evidence "$REMOTE_BAZEL_EVIDENCE_DIR/public-bundle.json"

      - name: Restore verified Bazel repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/plug-bazel-repository-cache
          key: plug-bazel-repository-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install pinned Bazel toolchain
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZEL_SHA256: d302d22ed77ee5658b87857249baa579db84300ecebe0a1e9a357b5b20f80eb8
        run: |
          set -euo pipefail
          bazel_version="$(tr -d '[:space:]' < .bazelversion)"
          [[ "$bazel_version" == 9.3.0 ]] || {
            echo "::error::unsupported Bazel pin: $bazel_version" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/plug-bazelisk-home" "$PLUG_BAZEL_REPOSITORY_CACHE" "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/plug-bazelisk" \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          printf '%s  %s\n' "$BAZELISK_SHA256" "$RUNNER_TEMP/plug-bazelisk" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/plug-bazelisk"
          cat > "$RUNNER_TEMP/plug.bazelrc" <<EOF
          common --enable_bzlmod
          common --color=no
          common --repository_cache=$PLUG_BAZEL_REPOSITORY_CACHE
          common --remote_cache=
          common --remote_executor=
          common --repo_contents_cache=
          test --nocache_test_results
          test --test_output=errors
          test --test_timeout=900
          EOF
          cat > "$RUNNER_TEMP/bin/bazel" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$RUNNER_TEMP/plug-bazelisk" --nosystem_rc --nohome_rc --noworkspace_rc \
            --bazelrc="$RUNNER_TEMP/plug.bazelrc" "\$@"
          EOF
          chmod 755 "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export BAZELISK_HOME="$RUNNER_TEMP/plug-bazelisk-home"
          export BAZELISK_VERIFY_SHA256="$BAZEL_SHA256"
          {
            echo "BAZEL_BIN=$RUNNER_TEMP/bin/bazel"
            echo "BAZEL_RC=$RUNNER_TEMP/plug.bazelrc"
            echo "BAZELISK_HOME=$BAZELISK_HOME"
            echo "BAZELISK_VERIFY_SHA256=$BAZELISK_VERIFY_SHA256"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/plug-bazelisk" --version | tee "$REMOTE_BAZEL_EVIDENCE_DIR/bazel-version.log"
          grep -Fq "bazel $bazel_version" "$REMOTE_BAZEL_EVIDENCE_DIR/bazel-version.log"
          printf '%s\n' "bazel_version=$bazel_version" "bazelisk_version=v1.29.0" \
            "bazelisk_sha256=$BAZELISK_SHA256" "bazel_sha256=$BAZEL_SHA256" \
            "repository_cache=$PLUG_BAZEL_REPOSITORY_CACHE" \
            "action_cache=disabled" "remote_execution=disabled" > \
            "$REMOTE_BAZEL_EVIDENCE_DIR/toolchain.txt"

      - name: Run remote Bazel command
        id: bazel
        env:
          PUBLIC_BUNDLE_DESCRIPTOR: ${{ steps.public_bundle.outputs.descriptor }}
          PUBLIC_REFERENCE_DESCRIPTOR: ${{ steps.public_reference.outputs.descriptor }}
        run: |
          set -euo pipefail
          read -ra USER_ARGS <<< "$ARGS_INPUT"
          if [[ -n "$PUBLIC_REFERENCE_DESCRIPTOR" ]]; then
            # This trusted helper has no token here. It routes the prepared
            # paths to tests or the single capture binary as literal argv.
            python3 "$RUNNER_TEMP/prepare-public-reference.py" route --args "$ARGS_INPUT" \
              > "$RUNNER_TEMP/plug-public-reference-argv"
            mapfile -d '' -t USER_ARGS < "$RUNNER_TEMP/plug-public-reference-argv"
          fi
          for arg in "${USER_ARGS[@]}"; do
            case "$arg" in
              --ignore_all_rc_files|--ignore_all_rc_files=*|--noignore_all_rc_files|\
              --output_user_root|--output_user_root=*|--bazelrc|--bazelrc=*)
                echo "::error::Bazel rc and output-root overrides are not permitted: $arg" >&2
                exit 1
                ;;
            esac
          done
          ARGS=(--nosystem_rc --nohome_rc --noworkspace_rc \
            "--bazelrc=$RUNNER_TEMP/plug.bazelrc")
          ARGS+=("${USER_ARGS[@]}")
          # Tests that build fixtures from this checkout need its root; the box
          # wrapper passes the same variable for its worktree.
          command=""
          for arg in "${USER_ARGS[@]}"; do
            case "$arg" in -*) ;; *) command=$arg; break ;; esac
          done
          if [[ "$command" == test || "$command" == coverage ]] &&
            [[ " ${USER_ARGS[*]} " != *"PLUG_SOURCE_MODULE_ROOT="* ]]; then
            ARGS+=("--test_env=PLUG_SOURCE_MODULE_ROOT=$GITHUB_WORKSPACE")
          fi
          if [[ -n "$PUBLIC_BUNDLE_DESCRIPTOR" ]]; then
            # The preparer publishes only these four public values after all
            # immutable metadata, manifest and executable checks succeed.
            for name in PLUG_PUBLIC_BEADS_BINARY PLUG_PUBLIC_BEADS_SHA256 \
              PLUG_PUBLIC_BEADS_BUILD_RUN PLUG_PUBLIC_BEADS_MANIFEST; do
              [[ -n "${!name}" ]] || { echo "missing prepared public executable value" >&2; exit 1; }
              ARGS+=("--test_env=$name=${!name}")
            done
          fi
          printf '%q ' bazel "${ARGS[@]}" > "$REMOTE_BAZEL_EVIDENCE_DIR/command.txt"
          printf '\n' >> "$REMOTE_BAZEL_EVIDENCE_DIR/command.txt"
          set +e
          bazel "${ARGS[@]}" 2>&1 | tee "$REMOTE_BAZEL_EVIDENCE_DIR/bazel.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$REMOTE_BAZEL_EVIDENCE_DIR/exit_code"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if (( rc != 0 )); then
            echo "Bazel exited $rc; evidence will still be uploaded" >&2
          fi

      # Checkout paths must be inside the workspace. Defer the helper checkout
      # until after Bazel so it cannot change the candidate's build inputs.
      - name: Checkout trusted CI helpers
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci/bazel-testlogs
          path: trusted-ci

      - name: Archive Bazel test logs
        if: always()
        run: |
          set -euo pipefail
          archive="$REMOTE_BAZEL_EVIDENCE_DIR/bazel-testlogs.tgz"
          python3 "$GITHUB_WORKSPACE/trusted-ci/scripts/ci/bazel-testlogs/archive.py" \
            --testlogs bazel-testlogs --output "$archive"

      - name: Upload remote Bazel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: remote-bazel-${{ inputs.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/remote-bazel-evidence/bazel.log
            ${{ runner.temp }}/remote-bazel-evidence/command.txt
            ${{ runner.temp }}/remote-bazel-evidence/exit_code
            ${{ runner.temp }}/remote-bazel-evidence/toolchain.txt
            ${{ runner.temp }}/remote-bazel-evidence/bazel-testlogs.tgz
            ${{ runner.temp }}/remote-bazel-evidence/public-bundle.json
            ${{ runner.temp }}/remote-bazel-evidence/public-bundle-helper-binding.txt
            ${{ runner.temp }}/remote-bazel-evidence/public-reference.json

      - name: Set job result to Bazel exit code
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f "$REMOTE_BAZEL_EVIDENCE_DIR/exit_code" ]]; then
            echo "::error::Bazel did not produce an exit code artifact" >&2
            exit 255
          fi
          rc="$(cat "$REMOTE_BAZEL_EVIDENCE_DIR/exit_code")"
          [[ "$rc" =~ ^[0-9]+$ ]] || {
            echo "::error::invalid Bazel exit code: $rc" >&2
            exit 255
          }
          if (( rc != 0 )); then
            exit "$rc"
          fi
