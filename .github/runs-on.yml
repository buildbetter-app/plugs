runners:
  bb-x64-16:
    cpu: [16]
    ram: [64]
    # Newer generations only: m6a/m6i compiled about 27% slower than Blacksmith
    # in the 2026-10-14 trials. Family order sets no preference; Spot uses the
    # price-capacity-optimized strategy, so any listed family can launch.
    # Exact `.*` selectors exclude variants such as m7i-flex and local-NVMe types.
    family: ["m8i.*", "m7i.*", "m8a.*", "m7a.*"]
    image: ubuntu24-full-x64
    volume: 200gb:gp3:750mbs:6000iops
    extras: ["s3-cache"]
  bb-x64-16-nvme:
    # Warm-Nx and other non-deploying Spot jobs use local NVMe. RunsOn puts
    # /home/runner, Docker and /tmp on instance storage; data dies with the VM.
    cpu: [16]
    ram: [64]
    family: ["m8id.*", "m6id.*"]
    image: ubuntu24-full-x64
    volume: 40gb:gp3:125mbs:3000iops
    extras: ["s3-cache"]
  bb-x64-16-ondemand:
    # Testing hardware trial: m8id has local NVMe for the workspace, Docker
    # and /tmp. This class is on-demand so Testing deploys avoid interruption.
    cpu: [16]
    ram: [64]
    family: ["m8id.*"]
    image: ubuntu24-full-x64
    volume: 200gb:gp3:750mbs:6000iops
    spot: false
    sticky: buildkit:200gb:gp3:750mbs:6000iops
    extras: ["s3-cache"]
  bb-x64-4:
    cpu: [4]
    ram: [16]
    family: ["m8i", "m7i", "m8a", "m7a", "m6i", "m6a"]
    image: ubuntu24-full-x64
    volume: 100gb:gp3:250mbs:3000iops
    extras: ["s3-cache"]
