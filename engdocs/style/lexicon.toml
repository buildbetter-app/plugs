[[term]]
match = ["gas town", "gastown", "gascity", "steampunk"]
class = "ban"

[[term]]
match = ["gastownhall", "steveyegge/beads"]
class = "upstream-infra"

[[term]]
match = ["molecule", "wisp", "polecat", "mayor", "convoy", "refinery", "deacon"]
class = "product-term"

[[term]]
match = ["witness", "crew", "rig", "sling", "hooked", "formula", "bd"]
class = "identifier"

# The pinned public companion requires this one environment assignment for
# stored-settings readback. Its Go spelling remains visible to source review.
[external_protocol_string]
path = "spec/s1-b25-b28/public_recording_test.go"
value = "BD_JSON_ENVELOPE=1"
# Exact accepted physical catalog, journal/cursor tables and dependency column.
# Each decoded literal is independently digest-bound by the checker.
physical_values = ["schema_migrations ignored_schema_migrations issues wisps dependencies wisp_dependencies labels wisp_labels comments wisp_comments events wisp_events config metadata local_metadata child_counters wisp_child_counters issue_counter issue_snapshots compaction_snapshots repo_mtimes routes interactions federation_peers custom_statuses custom_types provenance_events bd_events_journal bd_events_seq issue_versions store_epoch epoch_minted_addresses leases", "bd_events_seq", "bd_events_journal", "depends_on_wisp_id"]

# One physical table identity in its lower-level driver constant declaration.
[[source_plane_constant]]
path = "internal/storage/driver/source_planes_validate.go"
name = "sourcePlaneEphemeralDependencyTable"
value = "wisp_dependencies"

# The separate active-event fixture value stays local to the driver test.
[[source_plane_constant]]
path = "internal/storage/driver/source_planes_test.go"
name = "sourcePlaneFixtureActiveEventTable"
value = "wisp_events"

[[term]]
regex = "[\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{1F000}-\\x{1FAFF}\\x{FE0F}]"
class = "ban"
allow = ["✓", "✗", "⚠", "❄"]

[zones]
provenance = ["NOTICE.md", "engdocs/adr/", "engdocs/design/", "docs/migrate-from-beads.mdx", "internal/core/dumpformat/catalog.go", "internal/core/dumpformat/status_categories.go", "internal/core/dumpformat/records.go", "internal/core/dumpformat/validate.go", "internal/core/dumpformat/validate_test.go", "internal/core/dumpformat/merge_fixture_test.go", "internal/core/reverseconverter/reverseconverter_test.go", "internal/integration/converterroundtrip/import_test.go", "internal/integration/converterroundtrip/restore.go", "internal/integration/offlinehistory/testdata/generate.py", "internal/integration/offlinehistory/testdata/dolt-source-partial.md"]
