[[term]]
match = ["gas town", "gastown", "gascity", "steampunk"]
class = "ban"

[[term]]
match = ["gastownhall", "steveyegge/beads"]
class = "upstream-infra"

[[term]]
match = ["molecule", "wisp", "polecat", "mayor", "convoy", "refinery", "deacon"]
class = "product-term"

[[term]]
match = ["witness", "crew", "rig", "sling", "hooked", "formula", "bd"]
class = "identifier"

# The pinned public companion requires this one environment assignment for
# stored-settings readback. Its Go spelling remains visible to source review.
[external_protocol_string]
path = "spec/s1-b25-b28/public_recording_test.go"
value = "BD_JSON_ENVELOPE=1"

[[term]]
regex = "[\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{1F000}-\\x{1FAFF}\\x{FE0F}]"
class = "ban"
allow = ["✓", "✗", "⚠", "❄"]

[zones]
provenance = ["NOTICE.md", "engdocs/adr/", "engdocs/design/", "docs/migrate-from-beads.mdx", "internal/core/dumpformat/catalog.go", "internal/core/dumpformat/records.go", "internal/core/dumpformat/validate.go", "internal/core/dumpformat/validate_test.go", "internal/core/dumpformat/merge_fixture_test.go", "internal/core/reverseconverter/reverseconverter_test.go", "internal/integration/converterroundtrip/import_test.go", "internal/integration/converterroundtrip/restore.go", "internal/integration/offlinehistory/testdata/generate.py", "internal/integration/offlinehistory/testdata/dolt-source-partial.md"]
