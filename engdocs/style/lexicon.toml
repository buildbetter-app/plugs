# Exact B24 listener/table/refusal and fixture strings at one recorder path.
[native_recording_literals]
path = "spec/s1-b21-b24/native_recording_test.go"
values = ["bd serve: listening on http://", "bd_events_journal", "bd_events_seq", "wisp_dependencies", "B21-metadata-delta-despite-changed-false-and-wisp", "wisp only", "unsupported nonempty family wisp"]

# The views recorder admits only its two physical table names.
[native_view_strings]
path = "spec/s1-b21-b24/native_views_test.go"
values = ["bd_events_journal", "bd_events_seq"]

[[term]]
match = ["gas town", "gastown", "gascity", "steampunk"]
class = "ban"

[[term]]
match = ["gastownhall", "steveyegge/beads"]
class = "upstream-infra"

[[term]]
match = ["molecule", "wisp", "polecat", "mayor", "convoy", "refinery", "deacon"]
class = "product-term"

[[term]]
match = ["witness", "crew", "rig", "sling", "hooked", "formula", "bd"]
class = "identifier"

# The pinned public companion requires this one environment assignment for
# stored-settings readback. Its Go spelling remains visible to source review.
[external_protocol_string]
path = "spec/s1-b25-b28/public_recording_test.go"
value = "BD_JSON_ENVELOPE=1"
# Exact accepted physical catalog, journal/cursor tables and dependency column.
# Each decoded literal is independently digest-bound by the checker.
physical_values = ["schema_migrations ignored_schema_migrations issues wisps dependencies wisp_dependencies labels wisp_labels comments wisp_comments events wisp_events config metadata local_metadata child_counters wisp_child_counters issue_counter issue_snapshots compaction_snapshots repo_mtimes routes interactions federation_peers custom_statuses custom_types provenance_events bd_events_journal bd_events_seq issue_versions store_epoch epoch_minted_addresses leases", "bd_events_seq", "bd_events_journal", "depends_on_wisp_id"]

# Exact accepted manifest/build wire values at the separate native recorder.
[native_manifest_strings]
path = "spec/s1-b13-native/recording_test.go"
values = ["bd_export_version", "bin/bd-export", "//cmd/bd:bd", "/cmd/bd"]

# Complete accepted default-type and configuration vectors at exact fields.
# Fixed checker digests bind these readable path/field/value tuples.
[[native_field_literal]]
id = "ready-types"
path = "spec/s1-b01-b04/native_exclusion_test.go"
field = "nativeExclusionTypes.return"
values = ["merge-request", "gate", "molecule", "rig", "agent", "role", "message", "bug", "task"]

[[native_field_literal]]
id = "custom-types"
path = "spec/s1-b01-b04/native_exclusion_test.go"
field = "recordNativeExclusions.c.run.types.custom"
values = ["exclusions-type-config", "config", "set", "types.custom", "merge-request,rig,agent,role"]

[[native_field_literal]]
id = "native-type-binding-json"
path = "spec/s1-b01-b04/native_source_bindings.json"
field = "nativeTypeBoundary.defaultHidden"
values = ["merge-request", "gate", "molecule", "rig", "agent", "role", "message"]

# The exact physical census already used by the public recorder, at its JSON key.
[[native_field_literal]]
id = "catalog-sql-tables"
path = "internal/integration/b03catalog/native_catalog_inputs.json"
field = "sqlTables"
values = ["schema_migrations ignored_schema_migrations issues wisps dependencies wisp_dependencies labels wisp_labels comments wisp_comments events wisp_events config metadata local_metadata child_counters wisp_child_counters issue_counter issue_snapshots compaction_snapshots repo_mtimes routes interactions federation_peers custom_statuses custom_types provenance_events bd_events_journal bd_events_seq issue_versions store_epoch epoch_minted_addresses leases"]

[[term]]
regex = "[\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{1F000}-\\x{1FAFF}\\x{FE0F}]"
class = "ban"
allow = ["✓", "✗", "⚠", "❄"]

[zones]
# Exact prepared migration bridge files retain native type/sidecar vocabulary
# and removed caller text. New files do not inherit this provenance admission.
provenance = ["NOTICE.md", "engdocs/adr/", "engdocs/design/", "docs/migrate-from-beads.mdx", "internal/core/dumpformat/catalog.go", "internal/core/dumpformat/records.go", "internal/core/dumpformat/validate.go", "internal/core/dumpformat/validate_test.go", "internal/core/dumpformat/merge_fixture_test.go", "internal/core/reverseconverter/reverseconverter_test.go", "internal/integration/converterroundtrip/import_test.go", "internal/integration/converterroundtrip/restore.go", "internal/integration/offlinehistory/testdata/generate.py", "internal/integration/offlinehistory/testdata/dolt-source-partial.md", "tools/hostcallers/CONTRACT.md", "tools/hostcallers/category_fixture_test.py", "tools/hostcallers/fixtures/milestone_view_server.py", "tools/hostcallers/host-ontology.json", "tools/hostcallers/host_drivers.py", "tools/hostcallers/patches/host_drivers.py.patch", "tools/hostcallers/patches/pour_step.py.patch"]
